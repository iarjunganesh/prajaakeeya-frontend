customHeaders:
  # ===== Security headers (H-SEC-5) — apply to every path =====
  # The 4 non-CSP headers are enforced immediately (low risk). CSP ships in
  # Report-Only mode first: the browser LOGS violations to the console but
  # blocks nothing, so a missed allowlist entry can't break login/images/fonts
  # on deploy. Watch the console (and Sentry) for a few days; once clean, rename
  # the key from Content-Security-Policy-Report-Only to Content-Security-Policy
  # to enforce. See the audit follow-up §9 for the rationale per directive.
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: 'max-age=31536000; includeSubDomains; preload'
      - key: X-Frame-Options
        value: 'DENY'
      - key: X-Content-Type-Options
        value: 'nosniff'
      - key: Referrer-Policy
        value: 'strict-origin-when-cross-origin'
      # Report-Only for now (see note above). connect-src includes the API,
      # Sentry (EU), Firebase/FCM, Google APIs + Google Fonts CSS; script-src
      # and frame-src include accounts.google.com for the Google Sign-In flow.
      #
      # script-src also pins the two inline <script> blocks in index.html (the
      # preloader: lines ~672 and ~750) by SHA-256 hash, so CSP allows exactly
      # those scripts without weakening the policy with 'unsafe-inline'.
      # ⚠ HASHES ARE CONTENT-SENSITIVE: if you edit either inline preloader
      # script (even one character), its hash changes and CSP will report/block
      # it. Re-copy the new hash from the browser console's CSP violation message
      # and update it here whenever the preloader markup changes.
      - key: Content-Security-Policy-Report-Only
        value: "default-src 'self'; connect-src 'self' https://staging-api.prajaakeeya.org https://api.prajaakeeya.org https://*.ingest.de.sentry.io https://fcm.googleapis.com https://firebase.googleapis.com https://www.googleapis.com https://fonts.googleapis.com https://fonts.gstatic.com https://accounts.google.com; script-src 'self' https://accounts.google.com 'sha256-31NPMPg4uxz3+05+EF6wmStBy26rdh0Xkb2KmLvdkw0=' 'sha256-6Bs7ode2eMSX2S0dmS98woCYrStcbsyxCp5rcOto4ho='; img-src 'self' data: blob: https://*.s3.amazonaws.com https://*.cloudfront.net https://lh3.googleusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

  - pattern: '/sw.js'
    headers:
      - key: Cache-Control
        value: 'no-cache, no-store, must-revalidate'
      - key: Pragma
        value: 'no-cache'
      - key: Expires
        value: '0'

  # FCM background service worker — must never be cached so push/click updates
  # (deep-link handling) go live on the next visit instead of being pinned.
  - pattern: '/firebase-messaging-sw.js'
    headers:
      - key: Cache-Control
        value: 'no-cache, no-store, must-revalidate'
      - key: Pragma
        value: 'no-cache'
      - key: Expires
        value: '0'

  - pattern: '/index.html'
    headers:
      - key: Cache-Control
        value: 'no-cache, no-store, must-revalidate'

  - pattern: '/manifest.webmanifest'
    headers:
      - key: Cache-Control
        value: 'no-cache, no-store, must-revalidate'

  - pattern: '/registerSW.js'
    headers:
      - key: Cache-Control
        value: 'no-cache, no-store, must-revalidate'

  - pattern: '/assets/*'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
